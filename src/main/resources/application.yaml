spring:
  application:
    name: School Management System
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3307/schooldb?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true